name: Auto Update TVBox Configs

on:
  schedule:
    # 每天 02:00、14:00 UTC(即北京时间 10:00、22:00)
    - cron: '0 2,14 * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto update configs $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      - name: Push to Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN 未配置,跳过 Gitee 同步"
            exit 0
          fi
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://zhufei1989:${GITEE_TOKEN}@gitee.com/zhufei1989/yingshicang-config.git"
          git push gitee main --force
          git remote remove gitee
          echo "已同步到 Gitee"
